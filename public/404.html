<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Página no encontrada | SCN</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B0A10" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #0b0a10; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        font-family: Sora, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #cfc6dc;
        text-align: center;
        overflow-x: hidden;
        background:
          radial-gradient(60% 45% at 20% 10%, rgba(102, 34, 207, 0.55), transparent 70%),
          radial-gradient(50% 40% at 85% 20%, rgba(148, 104, 212, 0.35), transparent 70%),
          radial-gradient(70% 50% at 50% 100%, rgba(61, 21, 128, 0.45), transparent 70%),
          #0b0a10;
      }
      main { width: 100%; max-width: 30rem; }
      .eyebrow {
        margin: 0 0 12px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #c9b2e8;
      }
      h1 {
        margin: 0;
        font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(6.5rem, 30vw, 10rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
        background: linear-gradient(180deg, #fff 0%, #e0c8ff 38%, #9468d4 72%, #6622cf 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 18px rgba(148, 104, 212, 0.55));
      }
      h1 span { animation: flicker 4.2s steps(1, end) infinite; }
      @keyframes flicker {
        0%, 18%, 22%, 61%, 64%, 66%, 100% { opacity: 1; }
        19%, 21% { opacity: 0.25; }
        62% { opacity: 0.4; }
        65% { opacity: 0.15; }
      }
      h2 {
        margin: 16px 0 0;
        font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        color: #fff;
      }
      p { margin: 12px auto 0; max-width: 26rem; font-size: 0.95rem; line-height: 1.6; }
      .actions { margin-top: 28px; display: grid; gap: 10px; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 14px;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.07);
      }
      a.primary { background: #6622cf; border-color: #6622cf; box-shadow: 0 10px 30px -10px rgba(102, 34, 207, 0.8); }
      a:focus-visible { outline: 2px solid #9468d4; outline-offset: 2px; }
      @media (min-width: 480px) { .actions { grid-template-columns: 1fr 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404 · Se cortó el cable</p>
      <h1 aria-label="404">4<span aria-hidden="true">0</span>4</h1>
      <h2>Esto no está acá</h2>
      <p>El archivo o la página que buscás no existe. Seguí por el catálogo de SCN.</p>
      <div class="actions">
        <a class="primary" href="/catalogo">Ver catálogo</a>
        <a href="/">Volver al inicio</a>
      </div>
    </main>
  </body>
</html>
